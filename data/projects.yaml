- name: WATolls
  status: Live
  since: 2026
  featured: true
  icon: chart
  summary: Washington highway toll rate visualizer.
  pitch: Collects, serves and charts dynamic toll prices so you can find the cheapest time to cross. Go + Python + Hugo.
  description: The state only shows what a dynamic toll lane costs right now. WATolls records every rate about every 15 minutes, charts the last 7, 30 and 60 days, and finds the cheapest 15-minute window to cross on your commute.
  stack: [Python, Postgres, Go, Hugo, ECharts]
  url: https://watolls.danielsada.tech/
  writeup: /blog/watolls-washington-toll-visualizer

