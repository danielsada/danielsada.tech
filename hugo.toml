# danielsada.tech: Hugo site config. Theme: themes/hugo-breeze-plasma-inspired-theme (vendored copy, see README.md).
# Requires Hugo >= 0.158 (built and deployed with 0.170.1; see README.md > Deploy).
baseURL = "https://danielsada.tech/"
title = "Daniel Sada"
theme = "hugo-breeze-plasma-inspired-theme"
locale = "en-US"
defaultContentLanguage = "en"
mainSections = ["blog", "notas"]
capitalizeListTitles = false   # keep tag/series names as written
enableRobotsTXT = true
# Some posts contain raw HTML (<center>, <sup>) that Goldmark omits; that has always been the case, keep the log quiet.
ignoreLogs = ["warning-goldmark-raw-html"]

# URLs: Hugo's defaults (/blog/<file>/, /notas/<file>/, /tags/<tag>/, /categories/<cat>/ …) are the
# site's existing permalinks; don't add [permalinks] without adding redirects (static/_redirects).
[taxonomies]
  tag = "tags"
  category = "categories"
  etiqueta = "etiquetas"     # notas (ES)
  categoria = "categorias"   # notas (ES)
  series = "series"

# Google Analytics 4 (layouts/_partials/analytics.html, production builds only). The old UA-43424010-8 property
# forwards to this GA4 property; Universal Analytics itself stopped processing data in July 2023.
[services.googleAnalytics]
  id = "G-MNZDLPNSMQ"

[services.rss]
  limit = 30

[minify]
  minifyOutput = true

# Markdown images under static/images are also mounted as assets, so the theme's image render hook
# resizes them and converts them to WebP. The originals are still published at /images/… (static).
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"

[markup]
  [markup.highlight]
    noClasses = false          # the theme ships the token colours
    guessSyntax = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false   # titled images become <figure>
    [markup.goldmark.parser.attribute]
      block = true             # {.bubble .left} chat bubbles (assets/css/custom.css)
      title = true

[params]
  description = "Daniel Sada writes about developer productivity, engineering culture, AI and the software that saves him 100+ hours. Mostly in English, sometimes en español."
  tagline = "Developer Productivity & Culture"
  logo = "images/DanielSadaLogo.png"   # static/images, mounted as an asset (resized for the panel)
  favicon = "/favicon.ico"
  ogimage = "images/DanielSadaLogo.png"
  crumbroot = "danielsada.tech"
  colorscheme = "auto"
  [params.author]
    name = "Daniel Sada"
    email = "hello@danielsada.tech"
    emaillabel = "hello [at] danielsada.tech"   # visible text; links stay mailto:
    page = "/about"

  # Logo purple (the middle of the DanielSadaLogo.png gradient); these are also the theme's defaults.
  [params.colors]
    wall = "#3d6fd6"
    [params.colors.light]
      accent = "#8a5cd6"
      ink = "#5e2ca5"
    [params.colors.dark]
      accent = "#a77bff"
      ink = "#c6a8ff"

  [params.archive]
    path = "/posts"
    taxonomy = "tags"

  [params.series]
    taxonomy = "series"
    min = 2

  # Markdown images → WebP. Smaller than the theme default (960/75) to keep image-heavy posts near 200 KB;
  # the reading column is ~630 CSS px wide.
  [params.images]
    maxwidth = 800
    quality = 70

  # "Get my posts by email" (MailerLite) at the end of every post (layouts/_partials/hooks/post-end.html).
  # One form per language; the post's language (Notas = es) picks it. A plain form POST; no MailerLite
  # script or styles are loaded, and nothing is requested from MailerLite until someone subscribes.
  [params.newsletter]
    account = "938549"
    [params.newsletter.en]
      form = "120754711062120341"
      title = "Get my posts on your mail"
      text = "When I write something new, sign up to hear more."
      label = "Email address"
      placeholder = "Email"
      button = "Subscribe"
      sending = "Subscribing…"
      thanks = "Thank you! You have successfully joined my subscriber list."
      error = "Something went wrong. Please try again, or email hello [at] danielsada.tech."
    [params.newsletter.es]
      form = "120755004644525121"
      title = "Pon tu correo aquí si quieres que te lleguen mis nuevos posts"
      label = "Correo electrónico"
      placeholder = "Correo electrónico"
      button = "Suscribirse"
      sending = "Enviando…"
      thanks = "¡Gracias! Ya estás en mi lista de suscriptores."
      error = "Algo salió mal. Inténtalo de nuevo o escríbeme a hello [at] danielsada.tech."

  [params.projects]
    page = "/projects"
    statuses = ["Live", "Beta", "Paused", "Archived"]

  # Projects box in the panel (data/projects.yaml), below Places; theme defaults: 5 rows, collapsed on posts.
  [params.panel.projects]
    enable = true

  [params.home]
    [[params.home.main]]
      widget = "intro"
    # Latest posts as one compact list (title + date), followed by All posts / series / Notas links.
    [[params.home.main]]
      widget = "recent"
      title = "Latest posts"
      offset = 0
      count = 10
      serieslinks = false     # the series widget below lists them
    # Every series with its number of parts, under Latest posts.
    [[params.home.main]]
      widget = "series"
    [[params.home.side]]
      widget = "project"
    [[params.home.side]]
      widget = "talk"
    [[params.home.side]]
      widget = "section"
      section = "notas"
      count = 5

[menus]
  [[menus.main]]
    name = "All posts"
    pageRef = "/posts"
    weight = 10
    [menus.main.params]
      icon = "blog"
      count = true            # number of posts (every main section)
  [[menus.main]]
    name = "Notas"
    pageRef = "/notas"
    weight = 20
    [menus.main.params]
      icon = "notas"
      badge = "ES"
      count = true
  [[menus.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 30
    [menus.main.params]
      icon = "apps"
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 40
    [menus.main.params]
      icon = "user"
  [[menus.main]]
    name = "Contact"
    url = "mailto:hello@danielsada.tech"
    weight = 50
    [menus.main.params]
      icon = "mail"

  [[menus.social]]
    name = "GitHub"
    url = "https://github.com/danielsada"
    weight = 10
    [menus.social.params]
      icon = "github"
  [[menus.social]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/danielsadac"
    weight = 20
    [menus.social.params]
      icon = "linkedin"
  [[menus.social]]
    name = "X (Twitter)"
    url = "https://x.com/danielsadac"
    weight = 30
    [menus.social.params]
      icon = "x"
